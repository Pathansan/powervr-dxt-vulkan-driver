name: Build PowerVR DXT Compat Vulkan ICD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure and build arm64-v8a ICD
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Set up Python and package .wcp + Adrenotools .zip
        run: |
          python3 -m pip install --user zstandard
          python3 tools/package_wcp.py \
            --so build/libvulkan.powervr_compat.so \
            --out dist/powervr-dxt-compat-driver.wcp \
            --adrenotools-zip dist/powervr-dxt-compat-adrenotools.zip \
            --version "0.1.0-${GITHUB_SHA::7}"

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powervr-dxt-compat-driver
          path: |
            build/libvulkan.powervr_compat.so
            build/libvulkan_powervr_wrapper.so
            build/pvr_icd_test
            manifests/powervr_wrapper_icd.aarch64.json
            manifests/VkLayer_powervr_compat.json
            dist/powervr-dxt-compat-driver.wcp
            dist/powervr-dxt-compat-adrenotools.zip

      - name: Publish latest GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              dist/powervr-dxt-compat-adrenotools.zip \
              dist/powervr-dxt-compat-driver.wcp \
              build/libvulkan.powervr_compat.so \
              build/libvulkan_powervr_wrapper.so \
              build/pvr_icd_test \
              manifests/powervr_wrapper_icd.aarch64.json \
              manifests/VkLayer_powervr_compat.json \
              --clobber
          else
            gh release create latest \
              dist/powervr-dxt-compat-adrenotools.zip \
              dist/powervr-dxt-compat-driver.wcp \
              build/libvulkan.powervr_compat.so \
              build/libvulkan_powervr_wrapper.so \
              build/pvr_icd_test \
              manifests/powervr_wrapper_icd.aarch64.json \
              manifests/VkLayer_powervr_compat.json \
              --title "Latest PowerVR DXT Compat Driver" \
              --notes "Automated build from main (${GITHUB_SHA::7}). Use powervr-dxt-compat-adrenotools.zip for GameNative Driver Manager."
          fi
